services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/store_intelligence.db
      - POS_CSV_PATH=/app/dataset/pos_transactions.csv
    volumes:
      - db_data:/data
      - ./dataset:/app/dataset:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  db_data:
